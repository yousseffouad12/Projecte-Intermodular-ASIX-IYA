  <text x="388" y="353" text-anchor="middle" font-size="11" font-weight="600" fill="#e24b4a">Suricata 7.0.8  ·  IDS/IPS</text>

  <text x="388" y="386" text-anchor="middle" font-size="10" fill="#484f58">192.168.10.1</text>

