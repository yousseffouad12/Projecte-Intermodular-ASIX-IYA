  <path d="M951,490 L963,502 L951,530 L939,518 Z" fill="none" stroke="#0052CC" stroke-width="1.5"/>
  <path d="M951,496 L960,505 L951,524 L942,515 Z" fill="#0052CC" opacity="0.5" stroke="none"/>
