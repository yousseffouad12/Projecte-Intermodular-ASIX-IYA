  <path d="M820,432 L820,470" stroke="#d22128" stroke-width="2" stroke-linecap="round"/>
  <path d="M820,438 C826,436 832,438 834,444" fill="none" stroke="#d22128" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M820,446 C826,444 834,446 836,452" fill="none" stroke="#d22128" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M820,454 C826,452 830,454 832,460" fill="none" stroke="#d22128" stroke-width="1.5" stroke-linecap="round"/>

