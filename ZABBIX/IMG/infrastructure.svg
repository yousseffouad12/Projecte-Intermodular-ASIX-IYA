  <path d="M748,464 C748,458 752,448 760,444 C764,442 768,443 770,446" fill="none" stroke="#c0765a" stroke-width="2" stroke-linecap="round"/>
  <path d="M770,446 C773,452 771,460 766,464 C762,467 756,467 752,464" fill="none" stroke="#c0765a" stroke-width="2" stroke-linecap="round"/>
  <path d="M760,444 C760,440 762,436 766,434" fill="none" stroke="#c0765a" stroke-width="2" stroke-linecap="round"/>

