  <ellipse cx="112" cy="256" rx="18" ry="38" fill="none" stroke="#3d8b37" stroke-width="1.5"/>
  <line x1="74" y1="244" x2="150" y2="244" stroke="#3d8b37" stroke-width="1.5"/>
  <line x1="74" y1="268" x2="150" y2="268" stroke="#3d8b37" stroke-width="1.5"/>
  <line x1="74" y1="256" x2="150" y2="256" stroke="#3d8b37" stroke-width="1" stroke-dasharray="4 2"/>

