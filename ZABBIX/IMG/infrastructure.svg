<svg width="1000" height="560" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">

  <!-- Background -->
  <rect width="1000" height="560" fill="#0d1117"/>

  <!-- Corner decorations -->
  <path d="M24,24 L24,12 L36,12" stroke="#30363d" stroke-width="1.5" fill="none"/>
  <path d="M976,24 L976,12 L964,12" stroke="#30363d" stroke-width="1.5" fill="none"/>
  <path d="M24,536 L24,548 L36,548" stroke="#30363d" stroke-width="1.5" fill="none"/>
  <path d="M976,536 L976,548 L964,548" stroke="#30363d" stroke-width="1.5" fill="none"/>

