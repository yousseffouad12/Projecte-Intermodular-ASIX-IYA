  <text x="748" y="542" text-anchor="middle" font-size="11" fill="#6e7681">192.168.10.x  ·  Debian 12  ·  6GB RAM  ·  60GB SSD</text>
  <text x="748" y="560" text-anchor="middle" font-size="10" fill="#484f58">Dashboard  ·  Triggers  ·  Alertes  ·  Informes</text>
  <text x="748" y="577" text-anchor="middle" font-size="10" fill="#484f58">Monitorització en temps real</text>

