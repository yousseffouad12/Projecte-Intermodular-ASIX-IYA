  <path d="M935,414 L951,428 L967,414" fill="none" stroke="#EA4335" stroke-width="2" stroke-linejoin="round"/>
  <rect x="935" y="414" width="32" height="20" rx="2" fill="none" stroke="#EA4335" stroke-width="1.5"/>
