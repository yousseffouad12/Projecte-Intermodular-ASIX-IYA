  <text x="40" y="548" font-size="10" fill="#484f58">pfSense 2.7.2</text>
  <text x="140" y="548" font-size="10" fill="#484f58">·</text>
  <text x="152" y="548" font-size="10" fill="#484f58">Suricata 7.0.8</text>
  <text x="252" y="548" font-size="10" fill="#484f58">·</text>
  <text x="264" y="548" font-size="10" fill="#484f58">Zabbix 7.0 LTS</text>
